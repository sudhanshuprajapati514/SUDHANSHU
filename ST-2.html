<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Product Grid</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f2f2f2;
    }

    h1 {
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      margin: 10px 0 5px;
    }

    .price {
      color: green;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .btn {
      background: black;
      color: white;
      padding: 8px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background: #333;
    }
  </style>
</head>
<body>

  <h1>Responsive Product Grid</h1>

  <div class="grid">

    <div class="card">
      <img src="https://picsum.photos/200/150?1" alt="Product 1">
      <div class="title">Product One</div>
      <div class="price">₹999</div>
      <button class="btn">Buy Now</button>
    </div>

    <div class="card">
      <img src="https://picsum.photos/200/150?2" alt="Product 2">
      <div class="title">Product Two</div>
      <div class="price">₹1,499</div>
      <button class="btn">Buy Now</button>
    </div>

    <div class="card">
      <img src="https://picsum.photos/200/150?3" alt="Product 3">
      <div class="title">Product Three</div>
      <div class="price">₹799</div>
      <button class="btn">Buy Now</button>
    </div>

    <div class="card">
      <img src="https://picsum.photos/200/150?4" alt="Product 4">
      <div class="title">Product Four</div>
      <div class="price">₹1,199</div>
      <button class="btn">Buy Now</button>
    </div>

  </div>

</body>
</html>
